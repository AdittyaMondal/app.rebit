server {
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name app.rebit.in;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/app.rebit.in/public;

    client_max_body_size 4G;

    # Timeout settings for long-running requests (video/audio processing)
    proxy_read_timeout 7200s;
    proxy_connect_timeout 7200s;
    proxy_send_timeout 7200s;
    send_timeout 7200s;

    include /www/server/panel/vhost/nginx/extension/app.rebit.in/*.conf;

    # -----------------------------------------------------------------------
    # SECURITY: Block PHP execution in storage and upload directories
    # This is CRITICAL - prevents webshell execution via file upload attacks
    # -----------------------------------------------------------------------
    location ~* ^/(storage|uploads|files)/.*\.(php|phtml|php3|php4|php5|php7|phar|shtml|cgi)$ {
        deny all;
        return 404;
    }

    # Block hidden malware files like .cache.php, laravel.php in root
    location ~* ^/\.(cache|config|env|htaccess|git|svn).*$ {
        deny all;
        return 404;
    }

    # -----------------------------------------------------------------------
    # STORAGE: Serve uploaded media files correctly
    # The symlink public/storage -> storage/app/public must exist.
    # -----------------------------------------------------------------------
    location ^~ /storage/ {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Extra safety: deny any PHP-like files
        location ~* \.(php|phtml|phar)$ {
            deny all;
            return 404;
        }
    }

    # -----------------------------------------------------------------------
    # WEBSOCKET - Laravel Reverb
    # -----------------------------------------------------------------------
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Longer timeouts for WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_pass http://127.0.0.1:13000;
    }

    # -----------------------------------------------------------------------
    # LARAVEL ROUTING
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------------------
    # SSL CONFIGURATION
    # -----------------------------------------------------------------------
    #HTTP_TO_HTTPS_START
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END

    ssl_certificate    /www/server/panel/vhost/cert/app.rebit.in/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/app.rebit.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    error_page 497 https://$host$request_uri;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';

    # -----------------------------------------------------------------------
    # SECURITY HEADERS & CSP
    # -----------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net cdnjs.cloudflare.com static.cloudflareinsights.com;
        style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.jsdelivr.net;
        font-src 'self' fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        media-src 'self' blob: https:;
        connect-src 'self' wss://app.rebit.in https://app.rebit.in https://api.giphy.com;
        frame-ancestors 'self';
        worker-src 'self' blob:;
    " always;

    server_tokens off;

    # -----------------------------------------------------------------------
    # ERROR PAGES
    # -----------------------------------------------------------------------
    error_page 404 /index.php;
    error_page 502 /502.html;

    # -----------------------------------------------------------------------
    # PHP PROCESSING
    # -----------------------------------------------------------------------
    include enable-php-83.conf;
    include /www/server/panel/vhost/rewrite/app.rebit.in.conf;

    # -----------------------------------------------------------------------
    # FORBIDDEN FILES
    # -----------------------------------------------------------------------
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.env.*|\.svn|\.project|LICENSE|README.md|composer\.json|composer\.lock|package\.json|package-lock\.json|artisan|webpack\.mix\.js|vite\.config\.js)$ {
        return 404;
    }

    # Block direct access to Laravel internals (except 'app' which is the WS path)
    location ~ ^/(bootstrap/cache|storage/framework|storage/logs|config|database|routes|resources|tests|node_modules)/ {
        deny all;
        return 404;
    }

    # -----------------------------------------------------------------------
    # VENDOR ASSETS (Allow Livewire)
    # -----------------------------------------------------------------------
    location ^~ /vendor/livewire/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location ^~ /vendor/log-viewer/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location ~ ^/vendor/ {
        deny all;
        return 404;
    }

    # -----------------------------------------------------------------------
    # SSL CERTIFICATE VERIFICATION
    # -----------------------------------------------------------------------
    location ~ \.well-known {
        allow all;
    }

    # -----------------------------------------------------------------------
    # PHP FILE HANDLING
    # -----------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "display_errors=0";
    }

    # -----------------------------------------------------------------------
    # STATIC FILES CACHE
    # -----------------------------------------------------------------------
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|webp)$ {
        expires 30d;
        access_log off;
    }

    location ~ .*\.(js|css)?$ {
        expires 12h;
        access_log off;
    }

    location ~* \.(svg|woff|woff2|ttf|otf|eot|ttc|map|mp4|webm|ogg|ogv|zip|rar|tar|gz|bz2|7z)$ {
        expires max;
        log_not_found off;
    }

    access_log  /www/wwwlogs/app.rebit.in.log;
    error_log   /www/wwwlogs/app.rebit.in.error.log;
}
