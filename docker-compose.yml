# Rebit — production compose for Dokploy.
#
# Dokploy runs Traefik and owns host ports 80/443, so nothing here publishes a
# host port. In Dokploy: Compose -> Domains -> host = your domain,
# service = "app", container port = 80. Traefik terminates TLS.
#
# Reverb is NOT exposed separately: the app container's nginx proxies /app to
# it internally, so one domain and one certificate cover HTTP and WebSockets.
#
# Set every value under "Environment" in the Dokploy UI. Do not commit a .env.

# Vite inlines these into the JS bundle at build time, so they are build args,
# not runtime env. Changing any of them needs a rebuild, not a restart.
x-vite-args: &vite-args
  VITE_API_BASE_URL: "${APP_URL}"
  VITE_APP_API_PREFIX: "${APP_API_PREFIX:-api}"
  VITE_REVERB_APP_KEY: "${REVERB_APP_KEY}"
  VITE_REVERB_HOST: "${REVERB_HOST}"
  VITE_REVERB_PORT: "${REVERB_PORT:-443}"
  VITE_REVERB_SCHEME: "${REVERB_SCHEME:-https}"
  VITE_REVERB_CONNECTION_STATUS: "${VITE_REVERB_CONNECTION_STATUS:-on}"
  VITE_GIPHY_API_KEY: "${GIPHY_API_KEY}"
  VITE_APP_NEWS_RESOURCE_URL: "${APP_NEWS_RESOURCE_URL}"
  VITE_HIDE_AUTHOR_ATTRIBUTION: "${VITE_HIDE_AUTHOR_ATTRIBUTION:-false}"
  PUSHER_DEBUG_CONSOLE: "${PUSHER_DEBUG_CONSOLE:-false}"

x-app: &app
  # Distinct tag from the web image. Sharing one tag makes the two build
  # targets overwrite each other, and whichever built last wins - the app
  # container then has no nginx and nothing listens.
  image: rebit-worker:${APP_VERSION:-latest}
  restart: unless-stopped
  env_file: [.env]
  environment:
    WAIT_FOR_DB: "true"
    RUN_MIGRATIONS: "false"     # web service owns migrations; see below
  volumes:
    # Bind mounts to fixed host paths, NOT named volumes. A named volume is
    # prefixed with the compose project name, so if Dokploy ever recreates the
    # service under a different name it silently gets a new empty volume and
    # orphans every upload. These paths are outside Docker's volume namespace,
    # so they survive service recreation, renames, `compose down -v`, and
    # `docker volume prune`. Create them once on the host:
    #   mkdir -p /var/rebit/storage /var/rebit/logs && chown -R 33:33 /var/rebit
    - ${STORAGE_PATH:-/var/rebit/storage}:/var/www/html/storage/app
    - ${LOGS_PATH:-/var/rebit/logs}:/var/www/html/storage/logs
  depends_on:
    redis:   { condition: service_started }
  networks: [rebit]

services:
  # ---- web: nginx + php-fpm. The only service Dokploy routes a domain to ----
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/colibriplus/Dockerfile
      target: web
      args: *vite-args
    image: rebit-web:${APP_VERSION:-latest}
    environment:
      WAIT_FOR_DB: "true"
      # Only this service migrates, so parallel workers cannot race the same
      # migration. Set RUN_MIGRATIONS=false in the environment to skip it
      # (needed when restoring a dump before the schema is upgraded).
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
    expose:
      - "${APP_PORT:-80}"       # Traefik connects here. Set Dokploy's
                                # Domains -> Container Port to the same value.
    # Optional: reach the app directly at http://<vps-ip>:${APP_PORT},
    # bypassing Traefik. This serves PLAIN HTTP with no certificate, so the
    # domain (via Traefik, port 443) stays the correct way in. Uncomment only
    # if you specifically need raw IP access, and open the port in the firewall.
    # ports:
    #   - "${APP_PORT:-80}:${APP_PORT:-80}"
    # Dokploy's Traefik lives on the external dokploy-network. Without joining
    # it, Traefik cannot reach this container and the domain 502s.
    networks: [rebit, dokploy-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-80}/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ---- Reverb: WebSockets. Reached only via app nginx at /app --------------
  reverb:
    # The only service that builds the worker image. horizon and scheduler
    # reuse the resulting tag. Giving all three a build block made four
    # services load the same build context concurrently, and BuildKit handed
    # back inconsistent snapshots - one build saw 35MB, another 24MB, and a
    # COPY failed with "vite.config.js: not found" on a file that is present.
    build:
      context: .
      dockerfile: docker/colibriplus/Dockerfile
      target: worker
      args: *vite-args
    <<: *app
    command: ["php", "colibri", "reverb:start", "--host=0.0.0.0", "--port=13000"]
    expose:
      - "13000"

  # ---- Horizon: Redis queue workers ---------------------------------------
  horizon:
    <<: *app
    depends_on:
      redis:  { condition: service_started }
      reverb: { condition: service_started }   # builds rebit-worker
    command: ["php", "colibri", "horizon"]
    stop_grace_period: 60s

  # ---- Scheduler: replaces the host crontab -------------------------------
  scheduler:
    <<: *app
    depends_on:
      redis:  { condition: service_started }
      reverb: { condition: service_started }   # builds rebit-worker
    command: ["php", "colibri", "schedule:work"]

  # ---- Data ---------------------------------------------------------------
  # No mysql service here on purpose. This project uses a standalone Dokploy
  # database service, so defining one here would run a second, empty MySQL
  # and the app would silently talk to the wrong one. Point DB_HOST at the
  # Dokploy service's internal host (e.g. rebit-media-dfkjgw) instead.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in Dokploy}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [rebit]

volumes:
  redis:

networks:
  rebit:
    driver: bridge
  # Created by Dokploy on the host; Traefik is attached to it. Declared
  # external so compose joins the existing network instead of making its own.
  dokploy-network:
    external: true
