# Rebit — production compose for Dokploy.
#
# Dokploy runs Traefik and owns host ports 80/443, so nothing here publishes a
# host port. In Dokploy: Compose -> Domains -> host = your domain,
# service = "app", container port = 80. Traefik terminates TLS.
#
# Reverb is NOT exposed separately: the app container's nginx proxies /app to
# it internally, so one domain and one certificate cover HTTP and WebSockets.
#
# Set every value under "Environment" in the Dokploy UI. Do not commit a .env.

x-app: &app
  build:
    context: .
    dockerfile: docker/colibriplus/Dockerfile
    target: worker
  image: rebit-app:${APP_VERSION:-latest}
  restart: unless-stopped
  env_file: [.env]
  environment:
    WAIT_FOR_DB: "true"
    RUN_MIGRATIONS: "false"     # web service owns migrations; see below
  volumes:
    - storage:/var/www/html/storage/app
    - logs:/var/www/html/storage/logs
  depends_on:
    mysql:   { condition: service_healthy }
    redis:   { condition: service_started }
  networks: [rebit]

services:
  # ---- web: nginx + php-fpm. The only service Dokploy routes a domain to ----
  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/colibriplus/Dockerfile
      target: web
    environment:
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"    # exactly one service may migrate
    expose:
      - "${APP_PORT:-80}"       # Traefik connects here. Set Dokploy's
                                # Domains -> Container Port to the same value.
    # Optional: reach the app directly at http://<vps-ip>:${APP_PORT},
    # bypassing Traefik. This serves PLAIN HTTP with no certificate, so the
    # domain (via Traefik, port 443) stays the correct way in. Uncomment only
    # if you specifically need raw IP access, and open the port in the firewall.
    # ports:
    #   - "${APP_PORT:-80}:${APP_PORT:-80}"
    # Dokploy's Traefik lives on the external dokploy-network. Without joining
    # it, Traefik cannot reach this container and the domain 502s.
    networks: [rebit, dokploy-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-80}/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ---- Reverb: WebSockets. Reached only via app nginx at /app --------------
  reverb:
    <<: *app
    command: ["php", "colibri", "reverb:start", "--host=0.0.0.0", "--port=13000"]
    expose:
      - "13000"

  # ---- Horizon: Redis queue workers ---------------------------------------
  horizon:
    <<: *app
    command: ["php", "colibri", "horizon"]
    stop_grace_period: 60s

  # ---- Scheduler: replaces the host crontab -------------------------------
  scheduler:
    <<: *app
    command: ["php", "colibri", "schedule:work"]

  # ---- Data ---------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rebit}
      MYSQL_USER: ${DB_USERNAME:-rebit}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Dokploy}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in Dokploy}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [rebit]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in Dokploy}"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [rebit]

volumes:
  mysql:
  redis:
  storage:   # user uploads — persists across deploys
  logs:

networks:
  rebit:
    driver: bridge
  # Created by Dokploy on the host; Traefik is attached to it. Declared
  # external so compose joins the existing network instead of making its own.
  dokploy-network:
    external: true
