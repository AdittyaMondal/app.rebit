cgi.fix_pathinfo=0

; Uploads — keep client_max_body_size in docker/nginx/default.conf in step.
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 40

memory_limit = 512M
max_execution_time = 600
max_input_time = 600

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

allow_url_fopen = On      ; embed/embed + Socialite fetch remote URLs
allow_url_include = Off

; Defence in depth only. proc_open MUST stay enabled: php-ffmpeg depends on
; symfony/process, so disabling it silently breaks every video/audio upload,
; thumbnail, and chat video compression. shell_exec stays for the admin
; FFmpeg test panel (app/Livewire/Admin/Config/FFMPegTest.php). pcntl_* stays
; for Horizon's worker supervision.
; The real control against dropped webshells is the nginx rule that only lets
; /index.php reach php-fpm — see docker/nginx/default.conf.
disable_functions = exec,passthru,system,popen,dl

date.timezone = UTC
