# Rebit — in-container nginx. Fronted by Dokploy's Traefik, which terminates
# TLS and forwards plain HTTP here on port 80.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;   # Laravel web root — NOT the app root
    index index.php;
    charset utf-8;

    server_tokens off;

    # Uploads. Keep in step with php.ini upload_max_filesize / post_max_size.
    client_max_body_size 512M;

    # Traefik sets these; honour them so Laravel builds correct https:// URLs.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---- Reverb WebSocket -------------------------------------------------
    # Same origin as the app, so one domain and one certificate cover both.
    # Client connects to wss://<domain>/app -> Traefik -> here -> reverb:13000.
    location /app {
        proxy_pass http://reverb:13000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "Upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- Hardening --------------------------------------------------------
    # April 2026 incident: ~190 webshells were dropped across public/. A blanket
    # `location ~ \.php$` is what made them reachable. Only the front controller
    # executes here; any other .php under public/ is served as 404.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTPS           $http_x_forwarded_proto;
        fastcgi_param PHP_VALUE       "display_errors=0";
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    # Dotfiles, VCS metadata, and anything that leaks config.
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* /(composer\.(json|lock)|package(-lock)?\.json|artisan|colibri|vite\.config\.js|phpunit\.xml)$ {
        deny all;
        return 404;
    }

    # Never execute anything under user-writable trees.
    location ~* ^/(storage|uploads|files)/.*\.(php|phtml|php[57]|phar|pl|py|cgi|sh)$ {
        deny all;
        return 404;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot|mp4|webm|ogg|mp3|wav)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_log  /dev/stderr warn;
    access_log /dev/stdout;
}
